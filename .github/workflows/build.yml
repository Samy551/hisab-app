name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the newest project
        run: |
          ZIP=$(ls hisab-*.zip | sort -V | tail -n 1)
          echo "Using $ZIP"
          unzip -o "$ZIP" -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: hisab
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hisab-apk
          path: hisab/app/build/outputs/apk/debug/app-debug.apk
