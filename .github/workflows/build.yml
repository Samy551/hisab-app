name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the newest project
        run: |
          ZIP=$(ls hisab-*.zip | sort -V | tail -n 1)
          echo "Using $ZIP"
          unzip -o "$ZIP" -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: hisab
        run: gradle assembleDebug --no-daemon

      - name: Copy APK with a fixed name
        run: cp hisab/app/build/outputs/apk/debug/app-debug.apk hisab.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: حساب کتاب (تازہ ترین)
          files: hisab.apk
          overwrite_files: true
          make_latest: true
